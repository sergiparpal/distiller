# Tool settings only: Slice 1 is not packaged, so there is no [project] table.

[tool.ruff]
target-version = "py312"
# The code blocks in the SPEC and the notes are prose, aligned by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: the technical sheet documents the interfaces
    "CPY",     # no copyright headers
    "COM812",  # conflicts with ruff format
    "TC",      # imports stay at the top, with no TYPE_CHECKING blocks
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["distiller"]

[tool.ruff.lint.per-file-ignores]
# Only the modules that print, as the technical sheet says, may call print.
"src/distiller/{cli,evaluate,report}.py" = ["T201"]
"tests/**" = [
    "S101",     # assert is how pytest checks
    "PLR2004",  # literal values are what a test compares against
    "INP001",   # tests/ has no __init__.py: pytest imports it with importlib
]
".claude/hooks/**" = [
    "INP001",  # scripts that Claude Code runs, not a package
    "S603",    # they run bwrap, git, make and ruff with fixed argument lists
    "S607",    # those programs come from PATH, as in the Makefile
]
"scripts/**" = [
    "INP001",  # scripts that make runs, not a package
    "S603",    # they run git with fixed argument lists
    "S607",    # git comes from PATH, as in the Makefile
]
".claude/hooks/tests/**" = [
    "S101",     # assert is how pytest checks
    "PLR2004",  # literal values are what a test compares against
]

[tool.pyright]
include = ["src", "tests", "scripts", ".claude/hooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src"]
# Also measures the python -m distiller that a test runs as a process.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.importlinter]
root_package = "distiller"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "only coverage_at_m imports coverage"
type = "protected"
protected_modules = ["coverage"]
allowed_importers = ["distiller.coverage_at_m"]

[[tool.importlinter.contracts]]
name = "only junit imports defusedxml"
type = "protected"
protected_modules = ["defusedxml"]
allowed_importers = ["distiller.junit"]

[[tool.importlinter.contracts]]
name = "only git imports subprocess"
type = "protected"
protected_modules = ["subprocess"]
allowed_importers = ["distiller.git"]

# Slice 1 opens no network connection: tests/test_git.py checks that git runs
# only local commands, and this contract that no module imports these.
[[tool.importlinter.contracts]]
name = "no module imports the standard library's network modules"
type = "forbidden"
source_modules = ["distiller"]
forbidden_modules = [
    "socket",
    "ssl",
    "http",
    "urllib",
    "ftplib",
    "smtplib",
    "poplib",
    "imaplib",
    "xmlrpc",
    "socketserver",
    "asyncio",
    "multiprocessing",
]

[[tool.importlinter.contracts]]
name = "messages imports no other module of the package"
type = "forbidden"
source_modules = ["distiller.messages"]
forbidden_modules = ["distiller.*"]

[[tool.importlinter.contracts]]
name = "only __main__ imports cli"
type = "protected"
protected_modules = ["distiller.cli"]
allowed_importers = ["distiller.__main__"]

[[tool.importlinter.contracts]]
name = "only cli imports evaluate and report"
type = "protected"
protected_modules = ["distiller.evaluate", "distiller.report"]
allowed_importers = ["distiller.cli"]
