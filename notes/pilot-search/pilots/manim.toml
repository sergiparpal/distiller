# ManimCommunity/manim's job "test (ubuntu-22.04, 3.12)", for D-024's checks of
# a finalist, not for a replay. The job installs TeX Live, starts a virtual
# display and builds Cairo, then runs `uv sync --all-extras --locked`, here
# `--frozen`, and `python -m pytest`, then its doctests, which are not the
# suite here. Its lock holds pycairo with no Linux wheel, which builds against
# the system's Cairo. Its lock holds no pytest-timeout, which the harness adds.
# uv 0.13.8, the newest uv that a finalist's lock files ask for, runs every
# uv command here, with the system's Python 3.12: an interpreter that uv
# installs lives under the home, which the suite's sandbox hides (2026-11-22).
project = "manim"
repository = "ManimCommunity/manim"
base_branch = "main"
job = "test (ubuntu-22.04, 3.12)"
python = "3.12"
environment = [
    ["uv", "tool", "run", "--from", "uv==0.13.8", "uv", "sync", "--frozen", "--python", "/usr/bin/python3.12", "--all-extras"],
]
pytest = []
coverage_source = "manim"
seconds_per_test = 120
adds_timeout_plugin = true
