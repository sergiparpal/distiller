# wemake-services/wemake-python-styleguide's job "build (3.12)", for D-024's
# checks of a finalist, not for a replay. The job runs `poetry install
# --all-extras`, here with poetry 2.5.1 as the poetry pilot's, then `make
# test`: its lint, its type check, `poetry run pytest` and `pip check`. Only
# pytest is the suite here, so a red pull request whose job failed in its lint
# replays green. Its lock holds no pytest-timeout, which the harness adds.
project = "wemake-python-styleguide"
repository = "wemake-services/wemake-python-styleguide"
base_branch = "master"
job = "build (3.12)"
python = "3.12"
environment = [
    ["uv", "tool", "run", "--from", "poetry==2.5.1", "poetry", "env", "use", "/usr/bin/python3.12"],
    ["uv", "tool", "run", "--from", "poetry==2.5.1", "poetry", "install", "--all-extras"],
]
pytest = []
coverage_source = "wemake_python_styleguide"
seconds_per_test = 120
adds_timeout_plugin = true
