# feyninc/chonkie's job "test (3.12)", for D-024's checks of a finalist, not
# for a replay. The job runs `uv run --all-extras --dev pytest -nlogical
# --dist=worksteal -vv --cov=chonkie ...`: the environment is that sync, here
# `uv sync --frozen`, and the options that only print or measure are left
# out; pytest-xdist is in the lock of every red head. Its lock holds no
# pytest-timeout, which the harness adds.
# uv 0.13.8, the newest uv that a finalist's lock files ask for, runs every
# uv command here, with the system's Python 3.12: an interpreter that uv
# installs lives under the home, which the suite's sandbox hides (2026-11-22).
project = "chonkie"
repository = "feyninc/chonkie"
base_branch = "main"
job = "test (3.12)"
python = "3.12"
environment = [
    ["uv", "tool", "run", "--from", "uv==0.13.8", "uv", "sync", "--frozen", "--python", "/usr/bin/python3.12", "--all-extras", "--dev"],
]
pytest = ["-n", "logical", "--dist=worksteal"]
coverage_source = "chonkie"
seconds_per_test = 120
adds_timeout_plugin = true
