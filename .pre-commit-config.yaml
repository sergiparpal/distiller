# gitleaks: on each commit, the staged changes; in make check, the whole history.
# pre-commit builds it with this version of Go, which it downloads if needed.
default_language_version:
  golang: 1.27.2
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks over the whole history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]
