# feyninc/chonkie's job "test (3.12)", replayed with no network by Slice 3's
# harness (D-031). The job runs `uv run --all-extras --dev pytest -nlogical
# --dist=worksteal -vv --cov=chonkie ...`: the environment is that sync, here
# `uv sync --frozen`, and the options that only print or measure are left out;
# pytest-xdist is in the lock of every red head. Its lock holds no
# pytest-timeout, which the harness adds.
# uv 0.13.8, the newest uv that a finalist's lock files ask for, runs every uv
# command here, with the system's Python 3.12: an interpreter that uv installs
# lives under the home, which the suite's sandbox hides (2026-11-22).
# D-024's rule deselected 134 tests, each of which failed in at least one of
# six suite runs, two at each of three base commits, so whatever a pull
# request changes (notes/pilot-search/chonkie-feasibility.json): they are
# --deselect options of pytest, fixed before the first record (D-031). No
# floor configuration: the default patterns alone, as for Slice 2's pilots
# (D-015).
