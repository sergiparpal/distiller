name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Slice 2's suite runs go inside bubblewrap (D-011).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor leaves an unprivileged user namespace without the
      # rights to set its network up, so bwrap could not bring its loopback up:
      # "Failed RTM_NEWADDR: Operation not permitted" (run 44415471566).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make install
      - run: make check
